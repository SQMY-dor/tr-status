<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天基元活了吗</title>
<meta name="description" content="今天基元活了吗 · 基元律动 (tokenrhythm.studio) API 服务状态监控">
<style>
  :root {
    --bg: #0a0b0e;
    --bg-card: #111318;
    --bg-hover: #161920;
    --border: #1e222b;
    --text: #e8eaed;
    --text-dim: #9aa1ac;
    --text-faint: #5c6370;
    --green: #22c55e;
    --green-dim: rgba(34,197,94,.15);
    --yellow: #eab308;
    --yellow-dim: rgba(234,179,8,.15);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,.15);
    --gray: #3a3f4b;
    --accent: #7c8cff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 0 20px; }

  header { padding: 28px 0 8px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand .logo {
    width:38px; height:38px; border-radius:10px;
    background: linear-gradient(135deg, #7c8cff 0%, #b06cff 100%);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:17px; color:#fff; flex-shrink:0;
  }
  .brand h1 { font-size:20px; font-weight:700; letter-spacing:-.02em; }

  .banner {
    margin-top:20px; padding:15px 18px; border-radius:12px;
    display:flex; align-items:center; gap:12px; font-size:15px; font-weight:600;
    border:1px solid var(--border);
  }
  .banner .dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .banner.operational { background: var(--green-dim); color:#4ade80; border-color: rgba(34,197,94,.25); }
  .banner.operational .dot { background:var(--green); box-shadow:0 0 10px rgba(34,197,94,.7); }
  .banner.degraded_performance { background: var(--yellow-dim); color:#fbbf24; border-color: rgba(245,158,11,.25); }
  .banner.degraded_performance .dot { background:var(--yellow); box-shadow:0 0 10px rgba(234,179,8,.7); }
  .banner.partial_outage { background: var(--yellow-dim); color:#fbbf24; border-color: rgba(245,158,11,.25); }
  .banner.partial_outage .dot { background:var(--yellow); box-shadow:0 0 10px rgba(234,179,8,.7); }
  .banner.major_outage { background: var(--red-dim); color:#f87171; border-color: rgba(239,68,68,.25); }
  .banner.major_outage .dot { background:var(--red); box-shadow:0 0 10px rgba(239,68,68,.7); animation:pulse 1.2s infinite; }
  .banner .sub { font-weight:400; color:var(--text-dim); font-size:13px; margin-left:auto; }
  @keyframes pulse { 50% { opacity:.4; } }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px; }
  .stat { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .stat .v { font-size:22px; font-weight:700; letter-spacing:-.02em; }
  .stat .l { font-size:12px; color:var(--text-dim); margin-top:2px; }
  .stat .v.g { color:#4ade80; } .stat .v.y { color:#fbbf24; }
  .stat .v span.g { color:#4ade80; } .stat .v span.y { color:#fbbf24; } .stat .v span.r { color:#f87171; }

  section { margin-top:28px; }
  .sec-title { font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .sec-title .hint { font-weight:400; text-transform:none; letter-spacing:0; font-size:12px; color:var(--text-faint); }

  .range-switch { display:inline-flex; background:var(--bg-card); border:1px solid var(--border); border-radius:99px; padding:3px; gap:2px; }
  .range-switch button {
    border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600;
    padding:5px 14px; border-radius:99px; cursor:pointer; transition:all .15s;
  }
  .range-switch button:hover { color:var(--text); }
  .range-switch button.active { background:var(--accent); color:#fff; }

  .vendor { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; margin-bottom:14px; overflow:hidden; }
  .vendor-head {
    padding:13px 18px; display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
  }
  .vendor-head:hover { background: var(--bg-hover); }
  .vendor-head .name { font-weight:650; font-size:14.5px; }
  .vendor-head .cnt { font-size:12px; color:var(--text-faint); }
  .vendor-head .vstat { margin-left:auto; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .vendor-head .vstat .d { width:8px; height:8px; border-radius:50%; }
  .vendor-head .chev { color:var(--text-faint); font-size:11px; transition:transform .2s; }
  .vendor.open .chev { transform:rotate(90deg); }
  .vendor-body { display:none; border-top:1px solid var(--border); }
  .vendor.open .vendor-body { display:block; }

  /* DeepSeek 风格行: 顶行信息 + 下方 5 分钟格子条 */
  .mrow { padding:12px 18px 13px; border-bottom:1px solid var(--border); }
  .mrow:last-child { border-bottom:none; }
  .mrow-top { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .mrow-top .sdot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .sdot.up { background:var(--green); } .sdot.degraded { background:var(--yellow); } .sdot.down { background:var(--red); animation:pulse 1.2s infinite; }
  .mrow-top .mname { font-size:13.5px; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mrow-top .meta { font-size:11.5px; color:var(--text-faint); flex-shrink:0; }
  .mrow-top .spacer { flex:1; }
  .mrow-top .lat { font-size:12px; color:var(--text-dim); flex-shrink:0; }
  .mrow-top .pct { font-size:13px; font-weight:700; flex-shrink:0; }

  /* 格子条: 5 分钟/格 */
  .cells { display:flex; gap:1px; height:22px; overflow-x:auto; scrollbar-width:thin; scrollbar-color: var(--border) transparent; }
  .cells::-webkit-scrollbar { height:5px; }
  .cells::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
  .cell { flex-shrink:0; height:20px; border-radius:2px; background:var(--gray); opacity:.85; transition:opacity .15s; cursor:default; }
  .cell:hover { opacity:1; }
  .cell.up { background:var(--green); }
  .cell.degraded { background:var(--yellow); }
  .cell.down { background:var(--red); }

  /* 24h / 7 天视图: 单个 SVG 格子条 (DeepSeek 风格, 矢量渲染消除亚像素间距不均) */
  .cells.scroll-cells .lead { margin-left:auto; flex:0 0 0; }
  .cells svg { display:block; flex-shrink:0; }
  .cells svg rect { fill: var(--gray); opacity:.85; }
  .cells svg rect:hover { opacity:1; }
  .cells svg rect.up { fill: var(--green); }
  .cells svg rect.degraded { fill: var(--yellow); }
  .cells svg rect.down { fill: var(--red); }
  /* 90d 视图: 自适应填充 */
  .cells.flex-cells { overflow-x:hidden; }
  .cells.flex-cells .cell { flex:1 1 0; min-width:1px; width:auto; }

  .st-badge { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:99px; }
  .st-badge.up { background:var(--green-dim); color:#4ade80; }
  .st-badge.degraded { background:var(--yellow-dim); color:#fbbf24; }
  .st-badge.down { background:var(--red-dim); color:#f87171; }

  .incident { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom:10px; }
  .incident .it { display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px; }
  .incident .im { font-size:12.5px; color:var(--text-dim); margin-top:4px; }
  .incident .im code { color:#f87171; font-family:ui-monospace,monospace; }
  .no-inc { color:var(--text-faint); font-size:13.5px; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:18px; text-align:center; }

  footer { margin:36px 0 28px; color:var(--text-faint); font-size:12.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; border-top:1px solid var(--border); padding-top:18px; }
  footer a { color:var(--text-dim); text-decoration:none; }
  footer a:hover { color:var(--text); }
  .live { display:inline-flex; align-items:center; gap:6px; }
  .live .ld { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }

  #loading { text-align:center; padding:80px 0; color:var(--text-faint); }
  @media (max-width:640px) {
    .stats { grid-template-columns:repeat(2,1fr); }
    .mrow-top .meta { display:none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <div class="logo">律</div>
      <h1>今天基元活了吗</h1>
    </div>
    <div class="banner operational" id="banner">
      <div class="dot"></div>
      <span id="banner-text">加载中…</span>
      <span class="sub" id="checked-at"></span>
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="st-models"><span class="g">–</span>/<span class="y">–</span>/<span class="r">–</span></div><div class="l">可用/降级/不可用</div></div>
      <div class="stat"><div class="v g" id="st-uptime">–</div><div class="l">今日平均可用性</div></div>
      <div class="stat"><div class="v" id="st-latency">–</div><div class="l">当前平均首字延迟</div></div>
      <div class="stat"><div class="v" id="st-open">–</div><div class="l">未解决事故</div></div>
    </div>
  </header>

  <section>
    <div class="sec-title">
      <span>组件状态<span class="hint" id="range-hint"></span></span>
      <span class="range-switch">
        <button data-range="24h">24 小时</button>
        <button data-range="7d">7 天</button>
        <button data-range="90d">90 天</button>
      </span>
    </div>
    <div id="vendors"></div>
  </section>

  <section>
    <div class="sec-title">最近事故<span class="hint">自动检测</span></div>
    <div id="incidents"></div>
  </section>

  <footer>
    <div>基元律动 · 服务状态监控 · 探测间隔 5 分钟</div>
    <div class="live"><span class="ld"></span>自动刷新 30s · 数据更新 <span id="footer-time">–</span></div>
  </footer>
</div>

<div id="loading">加载状态数据…</div>

<script>
const VENDOR_MAP = [
  { name: "DeepSeek", prefix: "deepseek" },
  { name: "GLM (智谱)", prefix: "glm" },
  { name: "Kimi (月之暗面)", prefix: "kimi" },
  { name: "MiniMax", prefix: "minimax" },
  { name: "Qwen (通义)", prefix: "qwen" },
  { name: "Seed (字节)", prefix: "seed" },
  { name: "其他", prefix: null },
];

const OVERALL_TEXT = {
  operational: "所有系统运行正常",
  degraded_performance: "部分服务性能下降",
  partial_outage: "部分服务中断",
  major_outage: "重大服务中断",
};
const STATUS_TEXT = { up: "运行正常", degraded: "性能下降", down: "服务中断" };
const RANGE_INFO = {
  "24h": "最近 24 小时 · 每 5 分钟一格",
  "7d": "最近 7 天 · 每 5 分钟一格",
  "90d": "最近 90 天 · 按天聚合",
};

let currentRange = "24h";
let cached = null; // 最近一次完整数据

function fmtMs(ms) {
  if (ms == null) return "–";
  return ms >= 1000 ? (ms / 1000).toFixed(1) + "s" : Math.round(ms) + "ms";
}
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function fmtSlotTs(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDur(sec) {
  const m = Math.floor(sec / 60);
  if (m < 60) return m + " 分钟";
  const h = Math.floor(m / 60);
  return h + " 小时 " + (m % 60) + " 分";
}

function vendorOf(model) {
  for (const v of VENDOR_MAP) {
    if (v.prefix && model.startsWith(v.prefix)) return v.name;
  }
  return "其他";
}

// ---------- 5-minute slot cells ----------
// slots: { "2026-08-12": { "07:25": { model: {s, ttfb, err} } } }
// → sorted [{ ts, hm, e }] for one model, newest last
function slotCells(slots, model, maxCells) {
  const cells = [];
  const days = Object.keys(slots).sort();
  for (const dk of days) {
    const hms = Object.keys(slots[dk]).sort();
    for (const hm of hms) {
      const e = (slots[dk][hm] || {})[model];
      cells.push({ ts: Math.floor(Date.parse(dk + "T" + hm + ":00Z") / 1000), hm, e: e || null });
    }
  }
  return cells.slice(-maxCells);
}

function cellClass(e) {
  if (!e || !e.s) return "";
  if (e.s === "up") return "up";
  if (e.s === "degraded") return "degraded";
  return "down";
}
function cellTip(cell, model) {
  if (!cell.e) return model + " · " + fmtSlotTs(cell.ts) + " · 无数据";
  const st = STATUS_TEXT[cell.e.s] || cell.e.s;
  let tip = `${model} · ${fmtSlotTs(cell.ts)} · ${st}`;
  if (cell.e.ttfb != null) tip += " · 延迟 " + fmtMs(cell.e.ttfb);
  if (cell.e.err) tip += " · " + cell.e.err;
  return tip;
}

// SVG 格子条 (DeepSeek 风格): 单个 SVG + 整数坐标 rect, 矢量缩放时间距精确均匀,
// 避免 flex div + gap:1px 在高 DPI/浏览器缩放下被亚像素舍入导致的间距忽宽忽窄
function cellsSvg(cells, model) {
  if (!cells.length) return "";
  const W = 5, H = 20, GAP = 1, R = 2;
  const totalW = cells.length * (W + GAP) - GAP;
  let rects = "";
  cells.forEach((c, i) => {
    const x = i * (W + GAP);
    const tip = cellTip(c, model).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    rects += `<rect x="${x}" y="0" width="${W}" height="${H}" rx="${R}" class="${cellClass(c.e)}"><title>${tip}</title></rect>`;
  });
  return `<svg class="cells-svg" width="${totalW}" height="${H}" viewBox="0 0 ${totalW} ${H}">${rects}</svg>`;
}

// 时间段 uptime: 基于 slots (24h/7d) 或按天聚合 (90d)
function rangeUptime(data, model) {
  if (currentRange === "90d") {
    const days = data.history && data.history.days ? Object.keys(data.history.days).sort().slice(-90) : [];
    let ok = 0, t = 0;
    for (const dk of days) {
      const e = (data.history.days[dk] || {})[model];
      if (e && e.t) { ok += e.ok; t += e.t; }
    }
    return t ? ok / t : null;
  }
  const cells = slotCells(data.slots || {}, model, currentRange === "24h" ? 288 : 2016);
  let ok = 0, t = 0;
  for (const c of cells) if (c.e && c.e.s) { t++; if (c.e.s !== "down") ok++; }
  return t ? ok / t : null;
}

function render(data) {
  const latest = data.latest, history = data.history, incidents = data.incidents, catalog = (data.catalog && data.catalog.models) || {};
  if (!latest) { document.getElementById("banner-text").textContent = "暂无数据，等待首次探测…"; return; }

  // banner
  const banner = document.getElementById("banner");
  banner.className = "banner " + latest.overall;
  document.getElementById("banner-text").textContent = OVERALL_TEXT[latest.overall] || latest.overall;
  document.getElementById("checked-at").textContent = "更新于 " + fmtTime(latest.checked_at);
  document.getElementById("footer-time").textContent = fmtTime(latest.checked_at);

  const models = Object.entries(latest.models);
  const realModels = models.filter(([m]) => m !== "@api");
  const upNow = realModels.filter(([, r]) => r.status === "up").length;
  const degNow = realModels.filter(([, r]) => r.status === "degraded").length;
  const downNow = realModels.filter(([, r]) => r.status === "down").length;

  // today avg uptime
  const today = new Date().toISOString().slice(0, 10);
  const todayDay = history && history.days ? history.days[today] : null;
  let totOk = 0, totT = 0, latSum = 0, latN = 0;
  if (todayDay) {
    for (const e of Object.values(todayDay)) {
      totOk += e.ok; totT += e.t;
      if (e.ok > 0) { latSum += e.lat / e.ok; latN++; }
    }
  }
  const curLat = [];
  for (const [, r] of realModels) if (r.ttfb != null) curLat.push(r.ttfb);
  const avgCurLat = curLat.length ? Math.round(curLat.reduce((a, b) => a + b, 0) / curLat.length) : null;

  const openInc = incidents && incidents.events ? incidents.events.filter(e => !e.resolved_at) : [];

  const modelsEl = document.getElementById("st-models");
  modelsEl.innerHTML = `<span class="g">${upNow}</span>/<span class="y">${degNow}</span>/<span class="r">${downNow}</span>`;
  document.getElementById("st-uptime").textContent = totT ? (totOk / totT * 100).toFixed(1) + "%" : "–";
  document.getElementById("st-latency").textContent = fmtMs(avgCurLat);
  const openEl = document.getElementById("st-open");
  openEl.textContent = openInc.length;
  openEl.className = "v " + (openInc.length ? "y" : "g");

  // range hint
  document.getElementById("range-hint").textContent = RANGE_INFO[currentRange];

  // group by vendor
  const groups = {};
  for (const v of VENDOR_MAP) groups[v.name] = [];
  for (const [m, r] of models) {
    const vn = m === "@api" ? "平台网关" : vendorOf(m);
    if (!groups[vn]) groups[vn] = [];
    groups[vn].push([m, r]);
  }
  for (const k of Object.keys(groups)) if (!groups[k].length) delete groups[k];
  const order = ["平台网关", ...VENDOR_MAP.map(v => v.name).filter(n => groups[n])];

  const hasSlots = data.slots && Object.keys(data.slots).length > 0;

  const container = document.getElementById("vendors");
  container.innerHTML = "";
  for (const vn of order) {
    if (!groups[vn] || !groups[vn].length) continue;
    const rows = groups[vn];
    const downs = rows.filter(([, r]) => r.status === "down").length;
    const degraded = rows.filter(([, r]) => r.status === "degraded").length;
    let vlabel, vcolor;
    if (downs) { vlabel = `${downs} 个中断`; vcolor = "var(--red)"; }
    else if (degraded) { vlabel = `${degraded} 个性能下降`; vcolor = "var(--yellow)"; }
    else { vlabel = "全部正常"; vcolor = "var(--green)"; }

    const vEl = document.createElement("div");
    vEl.className = "vendor" + (downs || degraded ? " open" : "");
    const head = document.createElement("div");
    head.className = "vendor-head";
    head.innerHTML = `<span class="chev">▶</span><span class="name">${vn}</span><span class="cnt">${rows.length} 个组件</span>
      <span class="vstat"><span class="d" style="background:${vcolor}"></span><span style="color:${vcolor}">${vlabel}</span></span>`;
    head.onclick = () => {
      const willOpen = !vEl.classList.contains("open");
      vEl.classList.toggle("open");
      if (willOpen) {
        // 展开后滚到最右，显示最新数据
        vEl.querySelectorAll(".cells.scroll-cells").forEach(el => { el.scrollLeft = el.scrollWidth; });
      }
    };
    const body = document.createElement("div");
    body.className = "vendor-body";

    for (const [m, r] of rows) {
      const info = catalog[m];
      const ctx = info && info.context_length ? (info.context_length / 1000) + "K" : "";
      const price = info && info.input_price != null ? `¥${info.input_price}/${info.output_price}` : "";
      const meta = m === "@api" ? "OpenAI 兼容端点" : [ctx, price].filter(Boolean).join(" · ");

      // cells: 90d → flex 自适应; 24h/7d → 固定宽 5px 滚动 (DeepSeek 风格)
      let cellsHtml;
      const cellsWrap = currentRange === "90d" ? "cells flex-cells" : "cells scroll-cells";
      if (currentRange === "90d") {
        const days = history && history.days ? Object.keys(history.days).sort().slice(-90) : [];
        const bars = [];
        for (const dk of days) {
          const e = (history.days[dk] || {})[m];
          const u = e && e.t ? e.ok / e.t : null;
          const cls = u == null ? "" : u >= 0.995 ? "up" : u >= 0.95 ? "degraded" : "down";
          const tip = `${dk} · 可用性 ${u == null ? "无数据" : (u * 100).toFixed(1) + "%"}`;
          bars.push(`<div class="cell ${cls}" title="${tip}"></div>`);
        }
        cellsHtml = `<div class="${cellsWrap}">${bars.join("") || '<div class="cell" title="无数据"></div>'}</div>`;
      } else {
        const maxCells = currentRange === "24h" ? 288 : 2016;
        const cells = slotCells(data.slots || {}, m, maxCells);
        const lead = cells.length < maxCells ? `<span class="lead"></span>` : "";
        cellsHtml = `<div class="${cellsWrap}">${lead}${cellsSvg(cells, m)}</div>`;
      }

      const up = rangeUptime(data, m);
      const pctTxt = up == null ? "–" : (up * 100).toFixed(2) + "%";
      const pctColor = up == null ? "var(--text-faint)" : up >= 0.995 ? "var(--green)" : up >= 0.95 ? "var(--yellow)" : "var(--red)";

      const row = document.createElement("div");
      row.className = "mrow";
      row.innerHTML = `
        <div class="mrow-top">
          <span class="sdot ${r.status}"></span>
          <span class="mname" title="${m}">${m === "@api" ? "API 网关" : m}</span>
          <span class="meta">${meta}</span>
          <span class="spacer"></span>
          <span class="lat" title="最近探测首字延迟">${fmtMs(r.ttfb)}</span>
          <span class="pct" style="color:${pctColor}" title="所选时间段可用性">${pctTxt}</span>
        </div>
        ${cellsHtml}`;
      body.appendChild(row);
    }
    vEl.appendChild(head);
    vEl.appendChild(body);
    container.appendChild(vEl);
  }

  // 无 slot 数据提示 (24h/7d 且 KV 还没有 slot)
  if (!hasSlots && currentRange !== "90d") {
    const tip = document.createElement("div");
    tip.style.cssText = "font-size:12px;color:var(--text-faint);padding:10px 18px;border-bottom:1px solid var(--border);";
    tip.textContent = "⏳ 5 分钟粒度数据采集中，下一个探测周期开始填充（每 5 分钟一格）…";
    if (container.firstChild) container.insertBefore(tip, container.firstChild);
    else container.appendChild(tip);
  }

  // incidents
  const incBox = document.getElementById("incidents");
  incBox.innerHTML = "";
  const evs = incidents && incidents.events ? incidents.events.slice(0, 20) : [];
  if (!evs.length) {
    incBox.innerHTML = `<div class="no-inc">🎉 暂无事故记录</div>`;
  } else {
    for (const e of evs) {
      const div = document.createElement("div");
      div.className = "incident";
      const state = e.resolved_at
        ? `<span class="st-badge up">已恢复 · ${fmtTime(e.resolved_at)}</span>`
        : `<span class="st-badge down">进行中</span>`;
      const dur = e.resolved_at ? fmtDur(e.resolved_at - e.started_at) : fmtDur(Math.floor(Date.now() / 1000) - e.started_at);
      div.innerHTML = `
        <div class="it">${state}<span>${e.title}</span></div>
        <div class="im">开始 ${fmtTime(e.started_at)} · 持续 ${dur}${e.detail ? " · <code>" + e.detail.replace(/</g, "&lt;") + "</code>" : ""}</div>`;
      incBox.appendChild(div);
    }
  }

  // 滚动容器滚到最右 (最新数据在最右侧, DeepSeek 风格)
  container.querySelectorAll(".cells.scroll-cells").forEach(el => { el.scrollLeft = el.scrollWidth; });
}

async function load() {
  try {
    const res = await fetch("/api/status?range=" + currentRange, { cache: "no-store" });
    const data = await res.json();
    cached = data;
    document.getElementById("loading").style.display = "none";
    render(data);
  } catch (e) {
    document.getElementById("banner-text").textContent = "数据加载失败，即将重试…";
  }
}

// range switch
document.querySelectorAll(".range-switch button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".range-switch button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentRange = btn.dataset.range;
    if (cached) render(cached); // 立即用缓存重绘, 后台再拉新数据
    load();
  });
});
document.querySelector('.range-switch button[data-range="24h"]').classList.add("active");

load();
setInterval(load, 30000);
</script>
</body>
</html>
